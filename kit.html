<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NAME-O-MATIC — Kit Lab</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#07070f;--card:#0e0e1e;--border:rgba(255,255,255,.15);--text:#eeeeff;--muted:#8888bb;
  --a1:#ff6b35;--a2:#ffd23f;--a3:#06ffa5;--a4:#a855f7;--a5:#3b82f6;--a6:#ec4899;--bad:#ff4d6d;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 15% 0%,rgba(236,72,153,.09),transparent 55%),
             radial-gradient(ellipse 60% 40% at 85% 100%,rgba(59,130,246,.09),transparent 55%);}
nav{background:rgba(7,7,15,.97);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--border);
  height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:100;}
.logo{font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:3px;color:var(--a6);white-space:nowrap;}
.nbtn{font-family:'Fredoka One',cursive;font-size:.76rem;padding:7px 14px;border-radius:9px;background:rgba(255,255,255,.08);color:var(--text);text-decoration:none;border:1px solid var(--border);}
.nbtn:hover{background:rgba(255,255,255,.18);}
.hidden{display:none!important;}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px;position:relative;z-index:1;}
.hero-title{font-family:'Bangers',cursive;font-size:2.6rem;letter-spacing:3px;text-align:center;
  background:linear-gradient(135deg,var(--a6),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-sub{text-align:center;color:var(--muted);font-size:.85rem;margin:6px 0 16px;font-weight:700;}
.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;}
.panel{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.lbl{font-size:.65rem;letter-spacing:2px;color:var(--muted);font-weight:900;text-transform:uppercase;margin:10px 0 6px;}
.field{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.f{display:flex;flex-direction:column;gap:4px;}
.f label{font-size:.7rem;color:var(--muted);font-weight:800;}
input[type=text],input[type=number],select{width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;}
input[type=color]{width:100%;height:38px;border:1.5px solid var(--border);border-radius:9px;background:none;padding:2px;cursor:pointer;}
.pick{display:flex;flex-wrap:wrap;gap:6px;}
.pat{font-size:.72rem;font-weight:900;padding:7px 10px;border-radius:9px;border:1.5px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;font-family:'Nunito',sans-serif;}
.pat.on{border-color:var(--a3);color:var(--a3);background:rgba(6,255,165,.08);}
.btn{font-family:'Fredoka One',cursive;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;color:#07070f;background:var(--a3);font-size:.85rem;}
.btn.alt{background:rgba(255,255,255,.1);color:var(--text);}
.btn.pink{background:var(--a6);color:#fff;}
.btn.sm{padding:6px 10px;font-size:.72rem;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.stage{background:linear-gradient(180deg,#128a48,#0f6b3a);border-radius:16px;border:1.5px solid var(--border);padding:14px;}
.shirts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.shirts svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
.cap{text-align:center;font-size:.65rem;letter-spacing:2px;color:rgba(255,255,255,.8);font-weight:900;margin-top:6px;text-transform:uppercase;}
.legal{font-size:.68rem;color:var(--muted);margin-top:10px;text-align:center;font-weight:700;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:8px;text-align:center;}
.card svg{width:70px;height:auto;display:block;margin:0 auto 6px;}
.card .nm{font-family:'Fredoka One',cursive;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .sub{font-size:.62rem;color:var(--muted);font-weight:800;margin-bottom:6px;}
.empty{color:var(--muted);font-size:.8rem;font-weight:700;text-align:center;padding:10px;}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--a3);color:#07070f;font-family:'Fredoka One',cursive;padding:9px 16px;border-radius:999px;font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;}
.toast.show{opacity:1;}
@media (max-width:720px){
  html,body{overflow-x:hidden}
  .grid{grid-template-columns:1fr}
  .hero-title{font-size:2rem}
  nav{padding:0 10px}
  .field{grid-template-columns:1fr}
  .logo{font-size:1.05rem}
}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070f">
<script src="nom-net.js"></script>
</head>
<body>

<nav>
  <div class="logo">👕 KIT LAB</div>
  <div style="display:flex;gap:7px">
    <a href="index.html" class="nbtn">🏠 Home</a>
    <a href="app.html" class="nbtn">⚡ App</a>
  </div>
</nav>

<div class="wrap">
  <div class="hero-title">👕 KIT LAB</div>
  <div class="hero-sub">Design a shirt from scratch: colours, pattern, crest, name and number. Save, load and download as SVG.</div>

  <div class="grid">
    <!-- CONTROLS -->
    <div>
      <div class="panel">
        <div class="lbl">Club</div>
        <div class="field">
          <div class="f"><label for="clubName">Club name</label><input type="text" id="clubName" maxlength="28"></div>
          <div class="f"><label for="ini">Crest initials</label><input type="text" id="ini" maxlength="3"></div>
          <div class="f"><label for="sponsor">Sponsor text</label><input type="text" id="sponsor" maxlength="18"></div>
          <div class="f"><label for="crest">Crest shape</label>
            <select id="crest"><option value="shield">Shield</option><option value="circle">Roundel</option></select></div>
        </div>

        <div class="lbl">Back of shirt</div>
        <div class="field">
          <div class="f"><label for="player">Player name</label><input type="text" id="player" maxlength="16"></div>
          <div class="f"><label for="num">Number</label><input type="number" id="num" min="1" max="99"></div>
        </div>

        <div class="lbl">Colours</div>
        <div class="field">
          <div class="f"><label for="c1">Main</label><input type="color" id="c1"></div>
          <div class="f"><label for="c2">Second</label><input type="color" id="c2"></div>
          <div class="f"><label for="c3">Trim and crest</label><input type="color" id="c3"></div>
        </div>

        <div class="lbl">Pattern</div>
        <div class="pick" id="patPick"></div>

        <div class="row">
          <button class="btn" id="saveBtn">💾 Save design</button>
          <button class="btn alt" id="randBtn">🎲 Random</button>
          <button class="btn alt" id="dlBtn">⬇ Download SVG</button>
          <button class="btn alt" id="resetBtn">↺ Reset</button>
        </div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div>
      <div class="stage">
        <div class="shirts">
          <div><div id="front"></div><div class="cap">Front</div></div>
          <div><div id="back"></div><div class="cap">Back</div></div>
        </div>
      </div>
      <div class="legal">Fan-made designs for fun. Every club, name and sponsor here is fictional.</div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px">
    <div class="lbl" style="margin-top:0">Saved designs</div>
    <div class="gallery" id="gallery"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================================================================
// KIT LAB  -  ES5, SVG shirts, designs saved in localStorage
// =====================================================================
var KEY = 'nom_kits';
var PATTERNS = [
  { id: 'plain', label: 'Plain' }, { id: 'stripes', label: 'Stripes' }, { id: 'hoops', label: 'Hoops' },
  { id: 'sash', label: 'Sash' }, { id: 'halves', label: 'Halves' }, { id: 'chevron', label: 'Chevron' }
];
var RANDOM_NAMES = ['Harbour Rangers', 'Iron Vale Athletic', 'Coastal Corsairs', 'Northern Lights FC',
  'Redbrook Town', 'Silvermoor United', 'Ashcombe Wanderers', 'Grey Gull FC', 'Lantern Hill Rovers', 'Stonebridge City'];
var SHIRT = 'M95 30 Q150 62 205 30 L240 50 L280 85 L255 125 L225 110 L225 300 L75 300 L75 110 L45 125 L20 85 L60 50 Z';

var D = { name: 'Harbour Rangers', ini: 'HR', sponsor: 'NAME-O-MATIC', crest: 'shield',
  player: 'STRIKER', num: '9', c1: '#1d4ed8', c2: '#ffffff', c3: '#ffd23f', pat: 'stripes', id: null };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function toast(t) {
  var el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(function () { el.classList.remove('show'); }, 1600);
}

// readable text colour on a given background
function txtOn(hex) {
  var h = (hex || '#000000').replace('#', '');
  if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
  var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#0b0b14' : '#ffffff';
}

// ---------------------------------------------------------------------
// SVG shirt
// ---------------------------------------------------------------------
function patternBody(d) {
  var c1 = d.c1, c2 = d.c2, s = '', i;
  if (d.pat === 'stripes') {
    for (i = 0; i < 10; i++) s += '<rect x="' + (i * 30) + '" y="0" width="30" height="320" fill="' + (i % 2 ? c2 : c1) + '"/>';
  } else if (d.pat === 'hoops') {
    for (i = 0; i < 8; i++) s += '<rect x="0" y="' + (i * 40) + '" width="300" height="40" fill="' + (i % 2 ? c2 : c1) + '"/>';
  } else if (d.pat === 'sash') {
    s += '<rect x="0" y="0" width="300" height="320" fill="' + c1 + '"/>';
    s += '<polygon points="40,20 90,20 280,300 230,320" fill="' + c2 + '"/>';
  } else if (d.pat === 'halves') {
    s += '<rect x="0" y="0" width="150" height="320" fill="' + c1 + '"/>';
    s += '<rect x="150" y="0" width="150" height="320" fill="' + c2 + '"/>';
  } else if (d.pat === 'chevron') {
    s += '<rect x="0" y="0" width="300" height="320" fill="' + c1 + '"/>';
    s += '<polygon points="0,120 150,220 300,120 300,165 150,265 0,165" fill="' + c2 + '"/>';
  } else {
    s += '<rect x="0" y="0" width="300" height="320" fill="' + c1 + '"/>';
  }
  return s;
}

function kitSvg(d, side, prefix) {
  var cid = prefix + 'clip';
  var on = txtOn(d.c1);
  var out = '<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">';
  out += '<defs><clipPath id="' + cid + '"><path d="' + SHIRT + '"/></clipPath></defs>';
  out += '<g clip-path="url(#' + cid + ')">' + patternBody(d) + '</g>';
  out += '<path d="' + SHIRT + '" fill="none" stroke="' + d.c3 + '" stroke-width="8" stroke-linejoin="round"/>';
  if (side === 'front') {
    // crest on the left chest
    var ini = esc(d.ini || '');
    if (d.crest === 'circle') {
      out += '<g transform="translate(176,84)"><circle cx="17" cy="26" r="24" fill="' + d.c3 + '" stroke="' + txtOn(d.c3) + '" stroke-width="2"/>'
        + '<text x="17" y="33" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="20" fill="' + txtOn(d.c3) + '">' + ini + '</text></g>';
    } else {
      out += '<g transform="translate(176,84)"><path d="M0 0 H34 V26 Q34 46 17 54 Q0 46 0 26 Z" fill="' + d.c3 + '" stroke="' + txtOn(d.c3) + '" stroke-width="2"/>'
        + '<text x="17" y="32" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="18" fill="' + txtOn(d.c3) + '">' + ini + '</text></g>';
    }
    out += '<text x="150" y="168" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="13" fill="' + on + '">' + esc(d.sponsor) + '</text>';
  } else {
    out += '<text x="150" y="92" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="1" fill="' + on + '">' + esc(d.player).toUpperCase() + '</text>';
    out += '<text x="150" y="232" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="110" fill="' + d.c3 + '" stroke="' + txtOn(d.c3) + '" stroke-width="0">' + esc(d.num) + '</text>';
  }
  out += '</svg>';
  return out;
}

function render() {
  $('front').innerHTML = kitSvg(D, 'front', 'f');
  $('back').innerHTML = kitSvg(D, 'back', 'b');
  var btns = $('patPick').querySelectorAll('.pat');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-p') === D.pat);
}

function syncFromForm() {
  D.name = $('clubName').value.trim() || 'Your Club';
  D.ini = $('ini').value.trim().toUpperCase().slice(0, 3);
  D.sponsor = $('sponsor').value.trim();
  D.crest = $('crest').value;
  D.player = $('player').value.trim();
  D.num = String($('num').value || '').slice(0, 2);
  D.c1 = $('c1').value; D.c2 = $('c2').value; D.c3 = $('c3').value;
  render();
}

function fillForm() {
  $('clubName').value = D.name;
  $('ini').value = D.ini;
  $('sponsor').value = D.sponsor;
  $('crest').value = D.crest;
  $('player').value = D.player;
  $('num').value = D.num;
  $('c1').value = D.c1; $('c2').value = D.c2; $('c3').value = D.c3;
  render();
}

function buildPatButtons() {
  $('patPick').innerHTML = PATTERNS.map(function (p) {
    return '<button class="pat" data-p="' + p.id + '">' + p.label + '</button>';
  }).join('');
}

// ---------------------------------------------------------------------
// Save / load / gallery
// ---------------------------------------------------------------------
function loadKits() {
  try { var a = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(a)) return a; } catch (e) {}
  return [];
}
function storeKits(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e) { return false; } }

function saveDesign() {
  syncFromForm();
  var list = loadKits();
  var copy = {};
  for (var k in D) if (D.hasOwnProperty(k)) copy[k] = D[k];
  if (!copy.id) copy.id = 'k' + Date.now().toString(36);
  var idx = -1;
  for (var i = 0; i < list.length; i++) if (list[i].id === copy.id) idx = i;
  if (idx >= 0) list[idx] = copy; else list.unshift(copy);
  if (list.length > 24) list = list.slice(0, 24);
  D.id = copy.id;
  storeKits(list) ? toast('Saved ✓') : toast('Could not save (storage full?)');
  renderGallery();
}

function loadDesign(id) {
  var list = loadKits();
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) {
      var d = list[i];
      for (var k in d) if (d.hasOwnProperty(k)) D[k] = d[k];
      fillForm();
      toast('Loaded ' + d.name);
      return;
    }
  }
}

function deleteDesign(id) {
  var list = loadKits().filter(function (d) { return d.id !== id; });
  storeKits(list);
  if (D.id === id) D.id = null;
  renderGallery();
  toast('Deleted');
}

function renderGallery() {
  var list = loadKits();
  var box = $('gallery');
  if (!list.length) { box.innerHTML = '<div class="empty">No saved designs yet. Make one and hit Save.</div>'; return; }
  box.innerHTML = list.map(function (d, i) {
    return '<div class="card">' + kitSvg(d, 'front', 'g' + i + 'f')
      + '<div class="nm">' + esc(d.name) + '</div>'
      + '<div class="sub">' + esc(d.pat) + ' · #' + esc(d.num) + '</div>'
      + '<button class="btn sm alt" data-load="' + esc(d.id) + '">Load</button> '
      + '<button class="btn sm pink" data-del="' + esc(d.id) + '">Delete</button></div>';
  }).join('');
}

// ---------------------------------------------------------------------
// Random / reset / download
// ---------------------------------------------------------------------
function randomHex() {
  var h = Math.floor(Math.random() * 360), s = 55 + Math.floor(Math.random() * 35), l = 35 + Math.floor(Math.random() * 30);
  return hslToHex(h, s, l);
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  function hx(v) { var n = Math.round((v + m) * 255).toString(16); return n.length < 2 ? '0' + n : n; }
  return '#' + hx(r) + hx(g) + hx(b);
}
function randomKit() {
  D.name = pick(RANDOM_NAMES);
  D.ini = D.name.split(' ').map(function (w) { return w.charAt(0); }).join('').slice(0, 3).toUpperCase();
  D.player = pick(['STRIKER', 'CAPTAIN', 'THE WALL', 'MAESTRO', 'ROCKET', 'KEEPER']);
  D.num = String(1 + Math.floor(Math.random() * 99));
  D.c1 = randomHex(); D.c2 = randomHex(); D.c3 = randomHex();
  if (txtOn(D.c3) === txtOn(D.c1) && Math.random() < 0.5) D.c3 = '#ffffff';
  D.pat = pick(PATTERNS).id;
  D.crest = pick(['shield', 'circle']);
  D.id = null;
  fillForm();
}
function resetKit() {
  D = { name: 'Harbour Rangers', ini: 'HR', sponsor: 'NAME-O-MATIC', crest: 'shield',
    player: 'STRIKER', num: '9', c1: '#1d4ed8', c2: '#ffffff', c3: '#ffd23f', pat: 'stripes', id: null };
  fillForm();
}
function downloadSvg() {
  syncFromForm();
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340">'
    + '<rect width="620" height="340" fill="#128a48"/>'
    + '<g transform="translate(10,10)">' + kitSvg(D, 'front', 'df').replace('<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">', '<svg x="0" y="0" width="300" height="320" viewBox="0 0 300 320">') + '</g>'
    + '<g transform="translate(310,10)">' + kitSvg(D, 'back', 'db').replace('<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">', '<svg x="0" y="0" width="300" height="320" viewBox="0 0 300 320">') + '</g>'
    + '</svg>';
  var blob = new Blob([svg], { type: 'image/svg+xml' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (D.ini || 'kit').replace(/[^A-Za-z0-9]/g, '') + '-kit.svg';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); document.body.removeChild(a); }, 500);
  toast('Downloaded');
}

// ---------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------
buildPatButtons();
['clubName', 'ini', 'sponsor', 'crest', 'player', 'num', 'c1', 'c2', 'c3'].forEach(function (id) {
  $(id).addEventListener('input', syncFromForm);
  $(id).addEventListener('change', syncFromForm);
});
$('patPick').addEventListener('click', function (e) {
  var b = e.target;
  if (b && b.getAttribute && b.getAttribute('data-p')) { D.pat = b.getAttribute('data-p'); syncFromForm(); }
});
$('saveBtn').addEventListener('click', saveDesign);
$('randBtn').addEventListener('click', function () { randomKit(); toast('New kit'); });
$('resetBtn').addEventListener('click', function () { resetKit(); toast('Reset'); });
$('dlBtn').addEventListener('click', downloadSvg);
$('gallery').addEventListener('click', function (e) {
  var b = e.target;
  if (!b || !b.getAttribute) return;
  if (b.getAttribute('data-load')) loadDesign(b.getAttribute('data-load'));
  if (b.getAttribute('data-del')) deleteDesign(b.getAttribute('data-del'));
});

fillForm();
renderGallery();
</script>
</body>
</html>
