<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NAME-O-MATIC — Feeling Lucky</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#07070f;--card:#0e0e1e;--border:rgba(255,255,255,.15);--text:#eeeeff;--muted:#8888bb;
  --a1:#ff6b35;--a2:#ffd23f;--a3:#06ffa5;--a4:#a855f7;--a5:#3b82f6;--a6:#ec4899;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(255,210,63,.08),transparent 60%);}
nav{background:rgba(7,7,15,.97);border-bottom:1.5px solid var(--border);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:100;}
.logo{font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:3px;color:var(--a2);white-space:nowrap;}
.nbtn{font-family:'Fredoka One',cursive;font-size:.76rem;padding:7px 14px;border-radius:9px;background:rgba(255,255,255,.08);color:var(--text);text-decoration:none;border:1px solid var(--border);}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px;position:relative;z-index:1;text-align:center;}
.hero{font-family:'Bangers',cursive;font-size:2.6rem;letter-spacing:3px;background:linear-gradient(135deg,var(--a2),var(--a1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{color:var(--muted);font-size:.85rem;font-weight:700;margin:6px 0 14px;}
.wheelWrap{position:relative;width:min(340px,86vw);margin:0 auto;}
canvas{width:100%;height:auto;display:block;}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--a2);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));}
.btn{font-family:'Fredoka One',cursive;border:none;border-radius:12px;padding:14px 26px;cursor:pointer;color:#07070f;background:var(--a3);font-size:1.1rem;margin-top:16px;}
.btn:disabled{opacity:.5;cursor:default;}
.btn.alt{background:rgba(255,255,255,.1);color:var(--text);font-size:.9rem;padding:10px 16px;}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px;margin-top:16px;text-align:left;}
.lbl{font-size:.65rem;letter-spacing:2px;color:var(--muted);font-weight:900;text-transform:uppercase;}
.res{font-family:'Bangers',cursive;font-size:2rem;letter-spacing:2px;margin:4px 0;}
.chal{font-size:.92rem;font-weight:700;margin-top:6px;line-height:1.4;}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.hist{font-size:.75rem;color:var(--muted);font-weight:700;margin-top:10px;}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070f">
<script src="nom-net.js"></script>
</head>
<body>
<nav>
  <div class="logo">🎲 FEELING LUCKY</div>
  <div style="display:flex;gap:7px">
    <a href="index.html" class="nbtn">🏠 Home</a>
    <a href="app.html" class="nbtn">⚡ App</a>
  </div>
</nav>

<div class="wrap">
  <div class="hero">🎲 FEELING LUCKY</div>
  <div class="sub">Can't pick? Let the wheel decide. It picks a game and a challenge to go with it.</div>

  <div class="wheelWrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="340" height="340"></canvas>
  </div>
  <button class="btn" id="spin">🎡 Spin</button>

  <div class="card hidden-until" id="result" style="display:none">
    <div class="lbl">You got</div>
    <div class="res" id="gameName"></div>
    <div class="lbl" style="margin-top:10px">Challenge</div>
    <div class="chal" id="challenge"></div>
    <div class="row">
      <a class="btn" id="go" href="#" style="margin-top:0">▶ Play it</a>
      <button class="btn alt" id="again">Spin again</button>
    </div>
  </div>
  <div class="hist" id="hist"></div>
</div>

<script>
// Feeling Lucky: a spinning wheel over every game on the site, plus a random challenge.
var GAMES = [
  { n: 'Football Quiz', u: 'quiz.html', c: '#ff6b35' }, { n: 'Fantasy Football', u: 'fantasy.html', c: '#ffd23f' },
  { n: 'Career Mode', u: 'career.html', c: '#06ffa5' }, { n: 'Manager Mode', u: 'manager.html', c: '#3b82f6' },
  { n: 'Transfer Market', u: 'transfer.html', c: '#a855f7' }, { n: 'Referee Career', u: 'referee.html', c: '#ec4899' },
  { n: 'Pack Opening', u: 'packs.html', c: '#ff6b35' }, { n: 'Live Match Radio', u: 'radio.html', c: '#ffd23f' },
  { n: 'Daily Baller', u: 'guessr.html', c: '#06ffa5' }, { n: 'Player Comparison', u: 'compare.html', c: '#3b82f6' },
  { n: 'Manager Style Quiz', u: 'mgrquiz.html', c: '#a855f7' }, { n: 'Tactics Board', u: 'tactics.html', c: '#ec4899' },
  { n: 'Penalty Shootout', u: 'penalties.html', c: '#ff6b35' }, { n: 'Kit Lab', u: 'kit.html', c: '#ffd23f' },
  { n: 'Matchday Bingo', u: 'bingo.html', c: '#06ffa5' }, { n: 'Football Hangman', u: 'hangman.html', c: '#3b82f6' },
  { n: 'International Tournament', u: 'worldcup.html', c: '#a855f7' }, { n: 'Trophy Cabinet', u: 'trophy.html', c: '#ec4899' },
  { n: 'Stadium Explorer', u: 'stadium-explorer.html', c: '#ff6b35' }, { n: 'Practice Lab', u: 'physics.html', c: '#ffd23f' }
];
var CHALLENGES = [
  'Beat your best score before you close the tab.', 'Play it with your eyes shut for one round (kidding, keep them open).',
  'Do it in under five minutes.', 'Try to beat the last result you got.', 'Pick the most unlikely option and see what happens.',
  'Go for the highest score you can get, no second chances.', 'Play two rounds in a row without stopping.',
  'Make it a rivalry: beat your own record from yesterday.', 'Play it like you are the commentator, narrating every move.',
  'No cheating, no hints. Just you and the game.'
];
var HIST_KEY = 'nom_lucky_hist';

var canvas = document.getElementById('wheel');
var ctx = canvas.getContext('2d');
var angle = 0, spinning = false, chosen = -1;

function draw() {
  var n = GAMES.length, r = 160, cx = 170, cy = 170, slice = Math.PI * 2 / n;
  ctx.clearRect(0, 0, 340, 340);
  for (var i = 0; i < n; i++) {
    var a0 = angle + i * slice, a1 = a0 + slice;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a0, a1); ctx.closePath();
    ctx.fillStyle = (i === chosen) ? '#ffffff' : GAMES[i].c; ctx.fill();
    ctx.strokeStyle = '#07070f'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + slice / 2);
    ctx.fillStyle = '#07070f'; ctx.font = '700 10px Nunito, Arial, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(GAMES[i].n.length > 18 ? GAMES[i].n.slice(0, 17) + '…' : GAMES[i].n, r - 10, 4);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fillStyle = '#07070f'; ctx.fill();
}

function indexUnderPointer() {
  var n = GAMES.length, slice = Math.PI * 2 / n;
  var a = ((-Math.PI / 2 - angle) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
  return Math.floor(a / slice) % n;
}

function spin() {
  if (spinning) return;
  spinning = true;
  $btn.disabled = true;
  document.getElementById('result').style.display = 'none';
  var target = angle + Math.PI * 2 * (6 + Math.random() * 4) + Math.random() * Math.PI * 2;
  var start = angle, t0 = null, dur = 3800;
  function step(ts) {
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    var ease = 1 - Math.pow(1 - p, 4);
    angle = start + (target - start) * ease;
    chosen = -1;
    draw();
    if (p < 1) requestAnimationFrame(step);
    else { spinning = false; $btn.disabled = false; land(); }
  }
  requestAnimationFrame(step);
}
var $btn = document.getElementById('spin');

function land() {
  var i = indexUnderPointer();
  chosen = i; draw();
  var g = GAMES[i];
  document.getElementById('gameName').textContent = g.n;
  document.getElementById('challenge').textContent = CHALLENGES[Math.floor(Math.random() * CHALLENGES.length)];
  document.getElementById('go').href = g.u;
  document.getElementById('result').style.display = 'block';
  var h = [];
  try { h = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { h = []; }
  h.unshift(g.n); h = h.slice(0, 8);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch (e) {}
  document.getElementById('hist').textContent = 'Recent spins: ' + h.join(' · ');
}

$btn.addEventListener('click', spin);
document.getElementById('again').addEventListener('click', spin);
draw();
(function showHist() {
  try { var h = JSON.parse(localStorage.getItem(HIST_KEY)) || []; if (h.length) document.getElementById('hist').textContent = 'Recent spins: ' + h.join(' · '); } catch (e) {}
})();
</script>
</body>
</html>
